name: CI

# Fast quality gate. Jobs are added alongside the code they check: `frontend`
# arrives with the app, `gateway` with the compose stack. Referencing paths that
# do not exist yet would make the very first run red, and the auto-fix loop would
# start work on a false target.
#
# There is deliberately no `push` trigger: pushes to main will go through the
# build workflow, which calls this one via `workflow_call`. Adding `push` here
# would run the gate twice on every merge.
#
# The standalone run on pull_request is required and load-bearing: a workflow
# invoked through `workflow_call` does not produce its own run, and therefore
# emits no `workflow_run` event — which is what the auto-fix loop listens for.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First job on purpose: the repository is public, and learning about a leaked
  # key after the builds have finished means learning too late. The job is cheap
  # — one checkout and a grep over the index.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secrets in the index
        run: ./scripts/check-secrets.sh

      # Inside this job rather than its own: a separate job means another runner
      # and another minute spent starting it for a second of linting. shellcheck
      # is preinstalled on the ubuntu-latest image, so there is nothing to set up.
      - name: Shellcheck
        run: shellcheck scripts/*.sh
