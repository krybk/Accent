name: CI

# Fast quality gate. Jobs are added alongside the code they check — referencing
# paths that do not exist yet would make the first run red, and the auto-fix loop
# would start work on a false target.
#
# Runs on pull requests and on pushes to main. The `push` trigger was missing at
# first, carried over from a repository where a separate build workflow invoked
# this one through `workflow_call` — that workflow does not exist here, so the
# result was that nothing ever ran and main was never tested at all.
#
# There is no duplication to worry about: with no `workflow_call` caller, a merge
# produces exactly one run.
#
# The standalone run on pull_request is load-bearing: a workflow invoked through
# `workflow_call` does not produce its own run, and therefore emits no
# `workflow_run` event — which is what the auto-fix loop listens for.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First job on purpose: the repository is public, and learning about a leaked
  # key after the builds have finished means learning too late. The job is cheap
  # — one checkout and a grep over the index.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secrets in the index
        run: ./scripts/check-secrets.sh

      # Inside this job rather than its own: a separate job means another runner
      # and another minute spent starting it for a second of linting. shellcheck
      # is preinstalled on the ubuntu-latest image, so there is nothing to set up.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # protocol and gateway share one job. They are both plain Dart packages that
  # analyse and test in seconds, and gateway depends on protocol by path, so a
  # separate runner would only re-fetch the same dependencies.
  dart:
    name: dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: |
          cd protocol && dart pub get
          cd ../gateway && dart pub get

      # Formatting is checked before analysis: a formatting failure is
      # mechanical to fix, and reporting it first saves reading analyser output
      # that will shift line numbers anyway.
      - name: Format
        run: dart format --output=none --set-exit-if-changed protocol gateway

      - name: Analyze
        run: |
          cd protocol && dart analyze --fatal-infos
          cd ../gateway && dart analyze --fatal-infos

      - name: Tests
        run: |
          cd protocol && dart test
          cd ../gateway && dart test

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      # A debug APK, not a release one: this job has no signing keystore and
      # must not have one — CI on a pull request runs against branch contents,
      # and the release key is the one secret that must never be reachable from
      # there. It still catches what matters here: Gradle configuration errors,
      # a plugin needing a higher compileSdk, and R8 rules gone stale.
      - name: Android build
        working-directory: app
        run: flutter build apk --debug

  gateway-stack:
    name: gateway stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Validates service references and variable substitution without starting
      # anything. Catches the class of typo that would otherwise surface as an
      # opaque failure on a user's server during bootstrap.
      - name: Validate compose
        run: |
          cp gateway/.env.example gateway/.env
          docker compose -f gateway/docker-compose.yml --env-file gateway/.env config >/dev/null
          echo "compose is valid"

      # The image is built but not pushed. The gateway is compiled ahead of time,
      # so a build failure here is a compile failure — worth catching in CI
      # rather than during a bootstrap on someone's phone.
      - name: Build the gateway image
        run: docker build -f gateway/Dockerfile -t accent-gateway:ci .

      - name: The image starts and serves liveness
        run: |
          docker run -d --name gw -p 8080:8080 \
            -e GATEWAY_TOKEN=ci-token-long-enough-to-pass-validation \
            -e LITELLM_MASTER_KEY=ci-key \
            accent-gateway:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/live >/dev/null 2>&1; then
              echo "liveness answered after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "liveness never answered"; docker logs gw; exit 1
            fi
            sleep 1
          done
          # An unauthenticated request to a real endpoint must be refused. This
          # is the check that would catch a middleware wired in the wrong order.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/models)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          echo "unauthenticated request correctly refused"
          docker rm -f gw
