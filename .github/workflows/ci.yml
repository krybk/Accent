name: CI

# Быстрый гейт качества. Job-ы добавляются вместе с кодом, который они
# проверяют: `frontend` появится с приложением, `gateway` — с compose-стеком.
# Ссылаться на ещё не существующие пути нельзя, иначе первый же прогон красный
# и авто-цикл починки начинает работу с ложной цели.
#
# Отдельного триггера `push` нет намеренно: пуши в main пойдут через сборку,
# которая вызовет этот workflow через `workflow_call`. Добавить сюда `push` —
# значит прогонять гейт дважды на каждом мерже.
#
# При этом standalone-прогон на pull_request обязателен и нагружен смыслом:
# workflow, вызванный через `workflow_call`, не создаёт своего run и не
# порождает событие `workflow_run`, на которое смотрит авто-цикл починки.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Стоит первым: репозиторий публичный, и узнать об утёкшем ключе после того,
  # как отработали сборки, — значит узнать слишком поздно. Job дешёвый: один
  # checkout и grep по индексу.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Секреты в индексе
        run: ./scripts/check-secrets.sh

      # Внутри этого job, а не отдельным: свой job — это ещё один раннер и ещё
      # минута на его подъём ради секунды работы линтера. shellcheck
      # предустановлен в образе ubuntu-latest, ставить не нужно.
      - name: Shellcheck
        run: shellcheck scripts/*.sh
