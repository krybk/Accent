name: Auto-Fix Loop Monitor

# Reacts to the *result* of CI rather than to `pull_request: synchronize`.
# Reacting to synchronize means calling the checks API before the checks have
# started, which almost never sees a real failure.
#
# On green it squash-merges the PR, but only when every gate holds: the PR comes
# from this repository, carries the `auto-fixed` label, is not a draft, and does
# not touch the checks themselves. That last one matters most — see the guarded
# paths in the green branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  close-issue-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the Issue linked from the PR body
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/#(\d+)/);
            if (!match) {
              core.info('No Issue reference in the PR body — nothing to close.');
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(match[1]),
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed Issue #${match[1]}`);

  # A red CI run on main has no pull request attached, so there is nothing to
  # comment on and the PR path below never sees it. That was the whole gap: the
  # loop looked like it covered build failures and in fact covered only the ones
  # that happened inside a PR. An Issue is the wake-up channel here, since
  # claude.yml already listens for `issues: opened`.
  handle-main-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: The automation PAT is present
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "::error::secrets.AUTOMATION_TOKEN is not set in this repository." \
                 "Create a PAT with 'repo' and 'workflow' scope and add it under" \
                 "Settings -> Secrets and variables -> Actions. GITHUB_TOKEN cannot" \
                 "substitute: events it raises do not trigger claude.yml, so the" \
                 "Issue would be filed and never answered."
            exit 1
          fi

      - name: File an Issue asking Claude to fix main
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN }}
          script: |
            const MARKER = '<!-- automated-request -->';
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // Which jobs actually failed. This is both the useful part of the
            // report and the deduplication key: two different breakages on main
            // should get two Issues, the same one re-pushed should not.
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 },
            );
            const failed = jobs
              .filter((j) => j.conclusion === 'failure')
              .map((j) => ({
                job: j.name,
                steps: j.steps
                  .filter((s) => s.conclusion === 'failure')
                  .map((s) => s.name),
              }));

            if (failed.length === 0) {
              core.info('The run is red but no job is — nothing actionable.');
              return;
            }

            const signature = failed
              .map((f) => `${f.job}/${f.steps.join('+') || '?'}`)
              .join(', ');
            const title = `CI red on main: ${signature}`;

            // Dedup against open Issues only. A closed one means the cause was
            // dealt with; if it comes back it deserves a fresh Issue rather than
            // a comment on something already marked done.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });
            const duplicate = open.find((i) => i.title === title);

            // An open Issue with this signature means the previous attempt did
            // not finish — the fix never merged, or the session died. Returning
            // here silently was wrong: it turned "do not file twice" into "never
            // act on this signature again", and a stale Issue then suppressed
            // every future occurrence of that failure for good. Two of them
            // existed within an hour of this loop first running.
            //
            // So: nudge the existing Issue instead, under the same attempt cap
            // the pull request path uses. The marker makes the comment countable
            // and keeps it on Sonnet; it has to say "@claude" to wake anything.
            const MAX_ATTEMPTS = 1;
            if (duplicate) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: duplicate.number, per_page: 100,
              });
              const attempts = comments.filter((c) => (c.body || '').includes(MARKER)).length;

              if (attempts >= MAX_ATTEMPTS) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: duplicate.number, labels: ['needs-human'],
                });
                core.warning(
                  `#${duplicate.number}: still failing after ${attempts} nudge(s) — a human is needed.`,
                );
                return;
              }

              const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: [
                  MARKER,
                  `@claude still failing, now at ${run.head_sha.slice(0, 7)}.`,
                  `[Run log](${url}).`,
                  '',
                  'The instructions in the first message still apply — including',
                  'finishing with `gh pr create`. A branch without a pull request',
                  'is why this Issue is still open.',
                ].join('\n'),
              });
              core.info(`#${duplicate.number}: nudged, attempt ${attempts + 1}.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            const body = [
              MARKER,
              `@claude CI is red on \`main\` at ${run.head_sha.slice(0, 7)}.`,
              `[Run log](${runUrl}).`,
              '',
              '**Failed:**',
              ...failed.map((f) => `- \`${f.job}\` at ${f.steps.map((s) => `*${s}*`).join(', ') || 'an unnamed step'}`),
              '',
              'Read `docs/known-failures.md` before investigating — the cause may',
              'already be diagnosed there.',
              '',
              '**Finish by opening a pull request.** `gh pr create --base main`,',
              'with `Fixes #__ISSUE__` in the body. This is not optional and it is not',
              'the same as posting a compare link: the rest of the chain reacts to',
              'the `pull_request` event, and the line closing this Issue is parsed',
              'out of that body. A branch with no PR is work nobody collects — it',
              'has happened, and the whole session was paid for and wasted.',
              'Do not push to `main`; the PR is what gets checked.',
              '',
              'Reproduce the failing gate first, then run the gates for whatever you',
              'actually touched. Running all of them on every fix costs turns you may',
              'need to reach the PR:',
              '',
              '- format: `dart format protocol gateway`, and in `app/`:',
              '  `dart format lib test tool`. CI checks with',
              '  `--output=none --set-exit-if-changed`, which writes nothing —',
              '  reformat first, then verify.',
              '- `protocol/`, `gateway/`: `dart analyze --fatal-infos`, `dart test`.',
              '- `app/`: `flutter analyze`, `flutter test`.',
              '- `app/` only if you touched Gradle, the manifest or a plugin:',
              '  `flutter build apk --debug`. It takes minutes; skip it otherwise.',
              '',
              'If the cause is new, add it to `docs/known-failures.md` in the same PR.',
              'If it was deliberate — a commit message will say so — do not add one.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.create({
              owner, repo, title, body, labels: ['ci-failure'],
            });

            // The body has to name its own Issue number, and that number does
            // not exist until the Issue does. So it goes in as a placeholder and
            // is substituted here. The number is what close-issue-on-merge later
            // parses out of the pull request body.
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number,
              body: body.replaceAll('__ISSUE__', String(issue.number)),
            });

            core.info(`Filed #${issue.number} for: ${signature}`);

  # A green CI run on main settles every "CI red on main" Issue at once: the
  # signature in the title is, by definition, no longer failing. Left to a human
  # these accumulate, and a stale one is not merely untidy — deduplication keys
  # on the title, so an Issue nobody closed suppresses the nudge for the next
  # real occurrence of that same failure.
  #
  # Ones carrying `needs-human` are left alone. That label means a person was
  # asked to look, and a passing run does not answer whatever they were asked.
  close-stale-ci-failures:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        name: Close CI-failure Issues that green has settled
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 100,
            });

            for (const issue of open) {
              if (issue.labels.some((l) => l.name === 'needs-human')) {
                core.info(`#${issue.number}: needs-human — leaving it open.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `CI is green on \`main\` at ${run.head_sha.slice(0, 7)} — closing as settled.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`#${issue.number}: closed.`);
            }

  handle-ci-result:
    # Only CI runs that came from a pull request. Without the second condition
    # this job also woke on every push to main, where there is no PR to merge
    # or comment on — it would call the API, find nothing, and the only visible
    # effect was a red job on a commit whose CI was green. Pushes to main are
    # handled by handle-main-failure above.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # github-script fails with "Parameter token or opts.auth is required" when
      # the PAT is absent, which says nothing about what to do. Checked here so
      # the log names the missing secret instead.
      - name: The automation PAT is present
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "::error::secrets.AUTOMATION_TOKEN is not set in this repository." \
                 "Create a PAT with 'repo' and 'workflow' scope and add it under" \
                 "Settings -> Secrets and variables -> Actions. GITHUB_TOKEN cannot" \
                 "substitute: events it raises do not trigger claude.yml, so the" \
                 "retry comment would be posted and never answered."
            exit 1
          fi

      - name: Merge on green, or ask Claude to retry on red
        uses: actions/github-script@v8
        with:
          # PAT so the retry comment actually wakes claude.yml. GITHUB_TOKEN
          # cannot: events it raises do not trigger other workflows.
          github-token: ${{ secrets.AUTOMATION_TOKEN }}
          script: |
            // Guard against an endless fix→fail→fix cycle. With a PAT the bot
            // acts as a normal user, so `github.actor` cannot distinguish it —
            // the stop condition has to be an explicit attempt count.
            //
            // This marker does double duty: claude.yml also reads it to keep the
            // loop on Sonnet, since this comment has to say "@claude" to wake it
            // at all. Keep the two strings in sync.
            const MARKER = '<!-- automated-request -->';
            // One retry, not three. Every attempt is a full session, and
            // repeated blind attempts at the same root cause do not converge —
            // they just cost three times as much.
            const MAX_ATTEMPTS = 1;

            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let prs = run.pull_requests || [];
            if (prs.length === 0) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
              prs = data.filter((pr) => pr.state === 'open');
            }
            if (prs.length === 0) {
              core.info('This CI run is not attached to any open PR.');
              return;
            }

            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: ref.number,
              });

              // This repository is PUBLIC, so CI also runs on fork PRs. A
              // failing fork PR would otherwise make us post "@claude fix
              // this", waking a session with write access to work on code a
              // stranger controls. Fork PRs are a human's job.
              if (pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`PR #${pr.number}: from a fork — leaving it to a human.`);
                continue;
              }

              const labels = pr.labels.map((l) => l.name);

              if (run.conclusion === 'success') {
                if (!labels.includes('auto-fixed')) {
                  core.info(`PR #${pr.number}: not labelled auto-fixed — not merging.`);
                  continue;
                }
                if (pr.draft) {
                  core.info(`PR #${pr.number}: a draft — not merging.`);
                  continue;
                }

                // The failure mode an auto-fix loop trends towards is making the
                // check pass by weakening the check. A PR that edits the gates
                // themselves therefore never merges unread, however green it is:
                // green would then be measuring whatever the PR just rewrote.
                //
                // `.github/workflows/` used to be on this list and no longer is,
                // by a deliberate decision. The trigger wiring lives there, and
                // when it breaks the loop cannot repair itself — the first real
                // failure in this repository was exactly that, a missing `push`
                // trigger that meant nothing ever ran. A loop that cannot fix its
                // own plumbing needs a human for every such break, which defeats
                // the point of having it.
                //
                // What stays guarded is narrower and chosen for irreversibility:
                // the secrets gate and .gitignore. A weakened workflow costs a
                // bad merge, which is revertible. A leaked signing key or SSH key
                // in a public repository is not — it must be revoked and
                // reissued, and it is public from the moment it is pushed.
                //
                // Note this only widens what may merge unread. It does not widen
                // who may ask: the author allowlist in claude.yml still gates
                // that, and it is what keeps a stranger from reaching this path.
                const guarded = [
                  /^scripts\/check-secrets\.sh$/,
                  /^\.gitignore$/,
                ];
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: pr.number, per_page: 100,
                });
                const touched = files
                  .map((f) => f.filename)
                  .filter((name) => guarded.some((rule) => rule.test(name)));

                if (touched.length > 0) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: pr.number,
                    labels: ['needs-human'],
                  });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number,
                    body: [
                      'CI is green, but this PR changes the checks themselves, so',
                      'it will not be merged automatically:',
                      '',
                      ...touched.map((name) => `- \`${name}\``),
                      '',
                      'A green run cannot vouch for a change to what green means.',
                    ].join('\n'),
                  });
                  core.warning(
                    `PR #${pr.number}: touches guarded paths (${touched.join(', ')}) — human review required.`,
                  );
                  continue;
                }

                // Merged directly instead of through GitHub's auto-merge queue,
                // so this works without the "Allow auto-merge" repo setting.
                // The safety condition is `sha`: GitHub rejects the merge if the
                // branch moved after that run, so a later untested commit
                // cannot ride in on an older green result.
                try {
                  const { data: merge } = await github.rest.pulls.merge({
                    owner, repo,
                    pull_number: pr.number,
                    merge_method: 'squash',
                    sha: run.head_sha,
                  });
                  core.info(`PR #${pr.number}: merged (${merge.sha.slice(0, 7)}).`);
                } catch (err) {
                  // 405 = branch protection or conflicts block it,
                  // 409 = head moved since the green run. Neither is a reason
                  // to fail the workflow; a human or the next run picks it up.
                  core.warning(
                    `PR #${pr.number}: merge not performed (${err.status}): ${err.message}`,
                  );
                }
                continue;
              }

              if (run.conclusion !== 'failure') {
                core.info(`PR #${pr.number}: CI ended as ${run.conclusion} — skipping.`);
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const attempts = comments.filter((c) => (c.body || '').includes(MARKER)).length;

              if (attempts >= MAX_ATTEMPTS) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: ['needs-human'],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `Auto-fixing stopped after ${attempts} attempt(s). A human is needed.`,
                });
                core.warning(`PR #${pr.number}: attempt limit reached (${attempts}).`);
                continue;
              }

              const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: [
                  MARKER,
                  `@claude CI failed (attempt ${attempts + 1} of ${MAX_ATTEMPTS}). [Run log](${runUrl}).`,
                  '',
                  'Read `docs/known-failures.md` first — this failure may already be diagnosed there.',
                  '',
                  'Fix the cause and update this branch. Before pushing, run every',
                  'gate CI runs — the `app/` package is a separate one, and leaving it',
                  'out of this list is how a formatting failure reached CI before:',
                  '',
                  '- `dart format protocol gateway` and, in `app/`, `dart format lib test tool`.',
                  '  Note the missing flags: `--output=none --set-exit-if-changed` is the',
                  '  check CI runs, and it writes nothing. Reformat first, then verify.',
                  '- in each of `protocol/` and `gateway/`: `dart analyze --fatal-infos`, `dart test`.',
                  '- in `app/`: `flutter analyze`, `flutter test`.',
                  '',
                  'If you touched prompts or model routing, also run',
                  '`node scripts/cache-canary.js` — prompt caching breaks silently.',
                  '',
                  'If the cause is new, add it to `docs/known-failures.md` in the same PR.',
                ].join('\n'),
              });
              core.info(`PR #${pr.number}: fix requested, attempt ${attempts + 1}.`);
            }
