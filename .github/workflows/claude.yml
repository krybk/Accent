name: Claude Code Action (via OpenRouter)

# `labeled` is deliberately absent: it fires on every label our own workflows
# attach, which would re-trigger Claude on issues it has already handled.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  # Inline comments on a diff are a separate event from issue comments.
  pull_request_review_comment:
    types: [created]
  # Kept only so a human can open a PR whose body asks for help; the @claude
  # gate below applies to it as well.
  pull_request:
    types: [opened]

# One Claude session per thread at a time. Two sessions on the same PR would
# push to the same branch and fight; queueing is cheaper than untangling that.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Pure API calls, no model involved — this is what keeps the auto-merge chain
  # working now that Claude no longer reviews its own pull requests.
  label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label Claude's own pull request for auto-merge
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // A fork PR is attacker-controlled. Labelling it auto-fixed would
            // hand it to the merge path in auto-fix-loop.yml.
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info(`PR #${pr.number}: from a fork — not labelling.`);
              return;
            }

            // PRs are opened with AUTOMATION_TOKEN, so the author is the token
            // owner — indistinguishable from a hand-written PR. The branch
            // prefix is the signal instead: `branch_prefix` below pins it, and
            // only the pipeline creates branches under it.
            //
            // This used to key off a co-author trailer in the commit messages.
            // That trailer is no longer written, and a detector reading a field
            // that no longer exists fails silently — it would simply stop
            // labelling, and auto-merge would quietly never fire again.
            const AUTOMATED_PREFIX = 'auto/';

            if (!pr.head.ref.startsWith(AUTOMATED_PREFIX)) {
              core.info(
                `PR #${pr.number}: branch "${pr.head.ref}" is not under ` +
                `"${AUTOMATED_PREFIX}" — not labelling.`,
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number,
              labels: ['auto-fixed', 'ready-to-review'],
            });
            core.info(`PR #${pr.number}: labelled auto-fixed, ready to merge.`);

  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Decide whether Claude should run, and on which model
        id: check
        # Issue and comment bodies are attacker-controlled text. They are passed
        # in through env and quoted, never interpolated into the script with
        # ${{ }} — that would let a comment body execute shell commands here.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Login of whoever wrote the thing that woke us. GitHub computes this;
          # it cannot be forged from the body text.
          AUTHOR: >-
            ${{ github.event.comment.user.login
              || github.event.issue.user.login
              || github.event.pull_request.user.login }}
          # This repository is PUBLIC. Any GitHub user can open an issue saying
          # "@claude ...", and this job runs in the base-repo context with write
          # permissions, a PAT, and a provider key. Without this list a stranger
          # could have Claude commit on our behalf, or simply burn the model
          # budget by filing issues. The private repository this workflow came
          # from did not need the check; here it is load-bearing.
          #
          # Named logins rather than author_association: OWNER/MEMBER/
          # COLLABORATOR widens automatically as people are added to the
          # repository or org, which is the opposite of what a spend-and-write
          # gate should do. Adding someone here is a deliberate commit.
          #
          # Note the dependency this creates: the retry comment from
          # auto-fix-loop.yml is posted with AUTOMATION_TOKEN, so that PAT must
          # belong to a login on this list — otherwise the loop posts a comment
          # that this gate then refuses, and CI failures stop being picked up.
          ALLOWED_AUTHORS: "krybk"
          # Exact model IDs, never OpenRouter's ~family-latest aliases: an alias
          # will one day resolve to a pricier model with nothing in the logs
          # changing. A version change belongs in a commit.
          OPUS_MODEL: "anthropic/claude-opus-5"
          SONNET_MODEL: "anthropic/claude-sonnet-5"
          # Marker that our own workflows put in everything they write. The
          # retry comment in auto-fix-loop.yml has to say "@claude" to wake this
          # workflow at all, so without this marker the loop would escalate
          # itself to Opus on every red run.
          LOOP_MARKER: "<!-- automated-request -->"
        run: |
          case "$EVENT_NAME" in
            issues)
              body="$ISSUE_BODY"
              ;;
            issue_comment|pull_request_review_comment)
              body="$COMMENT_BODY"
              ;;
            pull_request)
              body="$PR_BODY"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # An empty author must never pass. Written as an explicit check
          # because the alternative fails open: with both variables empty,
          # `" " != *" "*` is false, and the gate would admit everyone. That is
          # exactly the bug this shape prevents.
          if [[ -z "$AUTHOR" ]]; then
            echo "Author is empty — not running."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The author check comes before the @claude check on purpose: a
          # stranger's issue must cost nothing at all, not even a token.
          if [[ " $ALLOWED_AUTHORS " != *" $AUTHOR "* ]]; then
            echo "Author '$AUTHOR' is not on the allowed list — not running."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$body" != *"@claude"* ]]; then
            echo "No @claude mention — not running."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Loop work — the CI retry comment — stays on Sonnet unconditionally.
          #
          # Everything else used to go to Opus purely because a human had
          # written it, which is an expensive thing to infer from authorship: a
          # human asking to rename a field paid Opus rates for it. The default is
          # now Sonnet, with two ways up.
          if [[ "$body" == *"$LOOP_MARKER"* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
            echo "Automated loop request — Sonnet."
            exit 0
          fi

          # The first way up is explicit, and it is the one to trust: write
          # [opus] in the body. A human who knows the task is hard should not
          # have to argue with a classifier about it.
          if [[ "$body" == *"[opus]"* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "model=$OPUS_MODEL" >> "$GITHUB_OUTPUT"
            echo "Explicitly requested — Opus."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "model=$SONNET_MODEL" >> "$GITHUB_OUTPUT"
          echo "triage=true" >> "$GITHUB_OUTPUT"
          echo "Defaulting to Sonnet; the triage step may raise it."

      # Both secrets checked here, after the author gate so a stranger's issue
      # still costs nothing, and before the action so the failure names itself.
      #
      # Without this, a missing model key surfaced as "Claude encountered an
      # error" on the Issue and, in the log, as the action's own env-validation
      # message listing three alternatives that mean nothing in this setup — we
      # authenticate to OpenRouter, not to the Anthropic API directly. The
      # useful information, which secret is empty, was the one thing absent.
      - name: The secrets this job needs are present
        if: steps.check.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          missing=
          [ -z "$OPENROUTER_API_KEY" ] && missing="$missing OPENROUTER_API_KEY"
          [ -z "$AUTOMATION_TOKEN" ] && missing="$missing AUTOMATION_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Not set in this repository:$missing." \
                 "Add them under Settings -> Secrets and variables -> Actions." \
                 "OPENROUTER_API_KEY is the model key, passed as anthropic_api_key" \
                 "and as ANTHROPIC_AUTH_TOKEN; AUTOMATION_TOKEN is a PAT with" \
                 "'repo' and 'workflow' scope, needed so the PRs this job opens" \
                 "start CI and may touch .github/workflows."
            exit 1
          fi

      # The action needs a checkout to run the project's tools.
      # One Haiku call, a few hundred tokens, to decide whether this needs Opus.
      #
      # The point is the asymmetry: reading a request is cheap and answering it
      # is not, so the decision belongs on the cheapest model that can make it.
      # What it must not do is fail upward — a classifier that errs towards Opus
      # costs more than no classifier at all, so anything unexpected here leaves
      # Sonnet in place. The explicit `[opus]` marker exists for when a human
      # disagrees with the outcome.
      - name: Ask Haiku whether this needs Opus
        id: triage
        if: steps.check.outputs.triage == 'true'
        # A triage failure must never stop the session. If this step dies, the
        # expression consuming its output falls back to the Sonnet default that
        # the previous step already wrote.
        continue-on-error: true
        env:
          BODY: ${{ github.event.issue.body || github.event.comment.body || github.event.pull_request.body }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          rubric='Answer with exactly one word, OPUS or SONNET, and nothing else.
          Answer OPUS only if the request requires designing an architecture,
          choosing between approaches with long-lived consequences, or reasoning
          about a system the request does not fully describe.
          Answer SONNET for implementing a stated design, fixing a failure,
          editing configuration or workflows, renaming, refactoring, adding
          tests, or writing documentation.
          When unsure, answer SONNET.'

          # The body is passed as data through jq, never interpolated into the
          # JSON by hand: a quote or a newline in an Issue would otherwise
          # produce an invalid request, and this step failing must not stop the
          # session.
          payload=$(jq -n --arg rubric "$rubric" --arg body "$BODY" '{
            model: "anthropic/claude-haiku-4.5",
            max_tokens: 4,
            system: $rubric,
            messages: [{role: "user", content: $body}]
          }')

          verdict=$(curl -s --max-time 30 "https://openrouter.ai/api/v1/messages" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "$payload" | jq -r '.content[0].text // ""' \
            | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' || true)

          # Substring rather than equality: a trailing full stop would otherwise
          # send every hard task to Sonnet and the classifier would look like it
          # was working. Anything that is not recognisably OPUS stays cheap.
          echo "Haiku says: ${verdict:-<nothing>}"
          if [ "${verdict#*OPUS}" != "$verdict" ]; then
            echo "model=anthropic/claude-opus-5" >> "$GITHUB_OUTPUT"
            echo "Raised to Opus."
          else
            echo "model=anthropic/claude-sonnet-5" >> "$GITHUB_OUTPUT"
            echo "Staying on Sonnet."
          fi

      - name: Checkout
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}

      # Installed here rather than left to Claude: the toolchain is not
      # something the session should spend turns on, and every turn is history
      # resent at full price.
      - name: Set up Flutter
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run Claude Code Action via OpenRouter
        id: claude
        if: steps.check.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # A PAT rather than GITHUB_TOKEN, so the PRs Claude opens actually
          # start CI instead of waiting for "Approve workflows to run".
          github_token: ${{ secrets.AUTOMATION_TOKEN }}
          # Required: the action validates its environment before starting and
          # does not accept ANTHROPIC_AUTH_TOKEN alone. Passing the OpenRouter
          # key both here and as ANTHROPIC_AUTH_TOKEN below is the setup
          # OpenRouter documents; the same key in either header authenticates.
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Must stay in sync with AUTOMATED_PREFIX in the label job above: that
          # job labels by this prefix, and auto-merge in auto-fix-loop.yml only
          # merges what carries the label. A mismatch stops auto-merge silently.
          branch_prefix: "auto/"
          # Note that `claude_args` is a block scalar, so a `#` line inside it is
          # not a comment — it becomes an argument. Commentary belongs out here.
          #
          # --max-turns was 25, which was too tight, and it failed in the
          # expensive way: the session diagnosed the failure, fixed it, ran every
          # gate and pushed a branch, then died on turn 26 before opening the
          # pull request. We paid for all of it and merged none of it, while the
          # action reported failure — so the loop looked broken with the work
          # sitting on a branch nobody was watching.
          #
          # A ceiling that low is a false economy. Cost is turns, so a budget
          # that cannot reach the end multiplies it rather than capping it: the
          # retry starts over from nothing.
          claude_args: |
            --model "${{ steps.triage.outputs.model || steps.check.outputs.model }}"
            --max-turns 60
            --allowedTools "Bash(git:*), Bash(gh:*), Bash(dart:*), Bash(flutter:*), Bash(docker:*), Bash(ls:*), Bash(cat:*), Bash(grep:*), Bash(find:*), Bash(mkdir:*), Bash(cp:*), Bash(mv:*), Bash(jq:*), Bash(node:*), Bash(python3:*), Edit, Read, Write, Glob, Grep"
        env:
          # `gh` reads this. Without it the session can push a branch — git is
          # authenticated by the action — and then cannot open a pull request,
          # which is where the chain actually continues: the label job listens
          # for `pull_request`, and a compare link is not an event. The PAT
          # rather than GITHUB_TOKEN for the same reason as everywhere else, so
          # the PR starts CI instead of waiting for approval.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          # OpenRouter serves an Anthropic Messages-compatible endpoint at
          # /api/v1/messages, so this base URL is correct as written.
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          # OpenRouter authenticates with `Authorization: Bearer`, which is what
          # ANTHROPIC_AUTH_TOKEN produces.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          # Tiers the CLI picks on its own (subagents, background summaries).
          # claude-haiku-5 does not exist: it was set here once and failed every
          # cheap-tier call with 400, silently pushing that work onto pricier
          # tiers. Exact IDs only.
          ANTHROPIC_DEFAULT_OPUS_MODEL: "anthropic/claude-opus-5"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "anthropic/claude-sonnet-5"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "anthropic/claude-haiku-4.5"
