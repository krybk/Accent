name: accent
description: Remote for server-side AI infrastructure
publish_to: none

# Version is the source of truth for the APK filename and the release tag.
# build+number is what Android uses to decide "newer", so it must increase on
# every published build even when the semantic version does not.
version: 0.3.0+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Same wire types as the gateway, by path. A protocol change breaks the build
  # on both sides instead of failing on a device.
  accent_protocol:
    path: ../protocol

  # SSH for the one-time bootstrap: password auth, remote exec, SFTP upload.
  # Verified against this version — see .claude/journal.md.
  dartssh2: ^3.3.1
  # Key generation, which dartssh2 does not provide. Same ed25519 implementation
  # dartssh2 signs with, so no second crypto library enters the tree.
  pinenacl: ^0.6.0
  # SHA-256 of the token this app writes into an existing gateway's tokens.d.
  crypto: ^3.0.6

  # Private keys and gateway tokens go here, not into shared preferences: this
  # wraps the Android Keystore, so the material is not readable by backup or by
  # an adb pull off a rooted device.
  flutter_secure_storage: ^11.0.0

  http: ^1.5.0

  # UI language: gen-l10n reads lib/l10n/*.arb; the chosen language code
  # persists in shared preferences — it is not a secret.
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5
  # Opens the links of the Situation screen's attention cards in the browser.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # Bundles the Material Icons font; without it a release build draws every icon as an empty box.
  uses-material-design: true
