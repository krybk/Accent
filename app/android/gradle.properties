# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which reserves 12 GB
# on machines that often have 8 GB in total. The daemon then dies mid-build with
# "Gradle build daemon disappeared unexpectedly" — no OOM message, no hint that
# memory was the cause. Measured here: the universal APK build was killed at 8G,
# and completes at 4G.
#
# 4 GB is comfortable for R8 on this project and fits both a modest server and a
# CI runner. Raise it only with a build that actually failed for want of heap.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
