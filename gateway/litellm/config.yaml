# LiteLLM routing config.
#
# One model_name per tier, so the app selects "sonnet" and not a provider-
# specific string. Swapping the underlying model then becomes an edit here plus a
# visible commit, rather than a silent change of what the app is paying for.
#
# Every tier talks to the Anthropic API directly, with the server's own
# ANTHROPIC_API_KEY. There is no intermediary and so no provider to pin: a
# direct connection has one provider, and the prompt cache stays on it.
#
# Exact model IDs, never aliases. An alias will one day resolve to a pricier
# model without anything in the logs changing. The IDs here must match the ones
# in gateway/lib/src/catalog.dart, whose prices describe them.

model_list:
  # Mechanical work behind a long stable prefix. Cheap only above ~4096 tokens
  # of prefix: below that Haiku does not cache at all, and its input then costs
  # more than Sonnet's cached input. See docs/engineering-journal.md.
  - model_name: haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Default tier for ordinary work.
  - model_name: sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Hard problems and exact architecture. Several times a Haiku turn, so it is
  # chosen deliberately, never as a fallback.
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # Per-call spend lands in Postgres. This is the whole reason LiteLLM is here
  # rather than a hand-rolled proxy: without per-call attribution there is no way
  # to tell whether a routing change saved anything.
  success_callback: ["postgres"]
  failure_callback: ["postgres"]
  # Return usage on streamed responses too. Without it the closing frame carries
  # no token counts, and cache hits become invisible precisely where most of the
  # spend happens.
  stream_options:
    include_usage: true
  drop_params: false
