name: accent_gateway
description: >-
  Control plane for an Accent server: chat, files, container orchestration.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.5.0
  # Same wire types as the app, by path rather than by publishing. This is the
  # point of Dart on both sides: a protocol change breaks the build here too.
  accent_protocol:
    path: ../protocol

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
